name: QueryScope v4 separately approved 48-call evaluation

# The actual approval file is intentionally absent until a new user approval.
# A template, ordinary code push or pull request cannot start a paid campaign.
on:
  push:
    branches: [main]
    paths: [docs/verification/queryscope-v4/live-approval.json]

permissions:
  contents: write
concurrency:
  group: queryscope-v4-runtime-approved
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.repository == 'sokldjs554/queryscope' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install evaluation dependencies
        run: pip install -e '.[api,dev]'
      - name: Check secret presence without printing its value
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get('OPENAI_API_KEY'):
              raise SystemExit('OPENAI_API_KEY is missing; no claim or request made')
          print('Existing OPENAI_API_KEY is configured; value not displayed')
          PY
      - name: Validate approval, atomically claim and execute once
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python scripts/evaluate_queryscope_runtime_llm.py --live
          --prepared docs/verification/queryscope-v4/live-prepared-v1
          --approval docs/verification/queryscope-v4/live-approval.json
          --output docs/verification/queryscope-v4/actual-api-v1
      - name: Preserve durable claim and both budget receipts
        if: always()
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from searchclinic.evaluation.runtime_campaign import CAMPAIGN_STATE_ROOT
          output = Path('docs/verification/queryscope-v4/actual-api-v1')
          if output.is_dir():
              prepared = json.loads(Path('docs/verification/queryscope-v4/live-prepared-v1/requests.json').read_text(encoding='utf-8'))
              state = CAMPAIGN_STATE_ROOT / prepared['canonical_campaign_sha256']
              if state.is_dir():
                  shutil.copytree(state, output / 'campaign-state')
              fields = ['GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA', 'GITHUB_REPOSITORY']
              (output / 'workflow.json').write_text(json.dumps({k: os.environ.get(k) for k in fields}, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Upload raw results even when evaluation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryscope-v4-runtime-api-${{ github.run_id }}
          path: docs/verification/queryscope-v4/actual-api-v1/
          if-no-files-found: warn
          retention-days: 90
      - name: Keep raw results on a separate branch
        if: always()
        run: |
          if test -f docs/verification/queryscope-v4/actual-api-v1/results.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch -c queryscope-v4-runtime-api-results
            git add docs/verification/queryscope-v4/actual-api-v1
            git commit -m 'Record v4 actual responses and durable campaign receipts'
            git push origin HEAD:refs/heads/queryscope-v4-runtime-api-results
          fi
