name: UI workspace snapshot
on:
  push:
    branches: [ui/search-quality-workbench]
    paths: [.github/workflows/ui-workspace-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: git archive --format=tar.gz -o /tmp/queryscope-ui-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: queryscope-ui-source
          path: /tmp/queryscope-ui-source.tar.gz
          retention-days: 7
          if-no-files-found: error
